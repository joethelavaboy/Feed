<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Button Showcase with Redirects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom background styling with dark overlay for readability */
        .bg-custom {
            background-image: linear-gradient(rgba(15, 23, 42, 0.78), rgba(15, 23, 42, 0.88)), 
                              url('https://placehold.co/1920x1080/1e293b/64748b?text=Background+Image');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Glassmorphic card styling */
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Loading pulse animation for redirect transition */
        @keyframes redirectPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.98); opacity: 0.8; }
        }

        .redirecting {
            animation: redirectPulse 0.6s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-custom min-h-screen text-slate-100 flex flex-col justify-between font-sans antialiased">

    <header class="p-6 text-center">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white drop-shadow-md">
            Interactive Navigation Hub
        </h1>
        <p class="text-slate-300 text-sm sm:text-base mt-2 max-w-lg mx-auto">
            Click any button to preview the destination image and navigate directly to the linked page.
        </p>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 sm:p-8 gap-6">
        
        <!-- Redirect Mode Switcher Toolbar -->
        <div class="glass-panel px-5 py-2.5 rounded-full flex items-center gap-4 text-xs sm:text-sm text-slate-300 shadow-lg">
            <span class="font-medium flex items-center gap-2">
                <i class="fa-solid fa-sliders text-blue-400"></i> Redirect Action:
            </span>
            <label class="inline-flex items-center gap-2 cursor-pointer hover:text-white">
                <input type="radio" name="redirectMode" value="newtab" checked class="text-blue-500 focus:ring-0">
                <span>Open in New Tab</span>
            </label>
            <label class="inline-flex items-center gap-2 cursor-pointer hover:text-white">
                <input type="radio" name="redirectMode" value="same" class="text-blue-500 focus:ring-0">
                <span>Navigate Current Page</span>
            </label>
        </div>

        <div class="glass-panel w-full max-w-5xl rounded-2xl p-6 sm:p-10 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-8 sm:gap-12 transition-all duration-300">
            
            <div class="w-full md:w-1/2 flex flex-col gap-4" id="button-container">
                
                <!-- Button 1 -->
                <button 
                    onclick="handleButtonClick(0)"
                    class="btn-option active group relative flex items-center justify-between px-6 py-4 rounded-xl border border-blue-500/50 bg-gradient-to-r from-blue-600/30 to-white-600/30 text-white font-semibold tracking-wide shadow-lg hover:scale-[1.02] transition-all duration-300 w-full text-left focus:outline-none">
                    <div class="flex items-center space-x-4">
                        <span class="p-2.5 rounded-lg bg-red-500 text-white transition-colors duration-300">
                            <i class="fa-solid fa-play"></i>
                        </span>
                        <div>
                            <div class="text-base font-bold">Youtube2016</div>
                            <div class="text-xs text-slate-400 group-hover:text-slate-200 transition-colors">/Feed/Youtube2016/</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-blue-400 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                    </div>
                </button>

                <!-- Button 2 -->
                <button 
                    onclick="handleButtonClick(1)"
                    class="btn-option group relative flex items-center justify-between px-6 py-4 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-300 font-semibold tracking-wide shadow-lg hover:scale-[1.02] transition-all duration-300 w-full text-left focus:outline-none">
                    <div class="flex items-center space-x-4">
                        <span class="p-2.5 rounded-lg bg-slate-700/50 text-white-400 group-hover:bg-rose-500 group-hover:text-white transition-colors duration-300">
                            <i class="fa-solid text-lg fa-play"></i>
                        </span>
                        <div>
                            <div class="text-base font-bold">Youtube2012</div>
                            <div class="text-xs text-slate-400 group-hover:text-slate-200 transition-colors">/Feed/Youtube2012/</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-500 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                    </div>
                </button>

                <!-- Button 3 -->
                <button 
                    onclick="handleButtonClick(2)"
                    class="btn-option group relative flex items-center justify-between px-6 py-4 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-300 font-semibold tracking-wide shadow-lg hover:scale-[1.02] transition-all duration-300 w-full text-left focus:outline-none">
                    <div class="flex items-center space-x-4">
                        <span class="p-2.5 rounded-lg bg-slate-700/50 text-white-400 group-hover:bg-red-500 group-hover:text-white transition-colors duration-300">
                            <i class="fa-solid text-lg fa-play"></i>
                        </span>
                        <div>
                            <div class="text-base font-bold">Youtube2006</div>
                            <div class="text-xs text-slate-400 group-hover:text-slate-200 transition-colors">/Feed/Youtube2006/</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-500 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                    </div>
                </button>

                <!-- Button 4 -->
                <button 
                    onclick="handleButtonClick(3)"
                    class="btn-option group relative flex items-center justify-between px-6 py-4 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-300 font-semibold tracking-wide shadow-lg hover:scale-[1.02] transition-all duration-300 w-full text-left focus:outline-none">
                    <div class="flex items-center space-x-4">
                        <span class="p-2.5 rounded-lg bg-slate-700/50 text-rose-400 group-hover:bg-rose-500 group-hover:text-white transition-colors duration-300">
                            <i class="fa-solid text-lg fa-r"></i>
                        </span>
                        <div>
                            <div class="text-base font-bold">Roblox2016</div>
                            <div class="text-xs text-slate-400 group-hover:text-slate-200 transition-colors">/Feed/Roblox2016/</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-500 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                    </div>
                </button>

                <!-- Button 5 -->
                <button 
                    onclick="handleButtonClick(4)"
                    class="btn-option group relative flex items-center justify-between px-6 py-4 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-300 font-semibold tracking-wide shadow-lg hover:scale-[1.02] transition-all duration-300 w-full text-left focus:outline-none">
                    <div class="flex items-center space-x-4">
                        <span class="p-2.5 rounded-lg bg-slate-700/50 text-rose-400 group-hover:bg-rose-500 group-hover:text-white transition-colors duration-300">
                            <i class="fa-solid text-lg fa-r"></i>
                        </span>
                        <div>
                            <div class="text-base font-bold">Roblox2006</div>
                            <div class="text-xs text-slate-400 group-hover:text-slate-200 transition-colors">/Feed/Roblox2006/</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-500 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                    </div>
                </button>

            </div>

            <div class="w-full md:w-1/2 flex flex-col items-center justify-center">
                <div id="preview-card" class="relative group w-64 h-64 sm:w-72 sm:h-72 lg:w-80 lg:h-80 rounded-2xl overflow-hidden border-2 border-slate-700 bg-slate-900 shadow-2xl flex items-center justify-center transition-all duration-500 hover:border-blue-500/50">
                    
                    <!-- Dynamic Image Element -->
                    <img 
                        id="preview-image" 
                        src="https://placehold.co/600x600/2563eb/ffffff?text=Youtube2016" 
                        alt="Selected Preview Image" 
                        class="w-full h-full object-cover transition-all duration-500 ease-out transform group-hover:scale-105"
                        onerror="this.src='https://placehold.co/600x600/334155/ffffff?text=Image+Unavailable'"
                    />

                    <!-- Redirect Toast / Overlay Alert -->
                    <div id="redirect-banner" class="absolute top-3 left-3 right-3 bg-slate-900/90 backdrop-blur-md border border-slate-700 text-xs text-slate-200 px-3 py-2 rounded-lg flex items-center justify-between opacity-0 transition-opacity duration-300">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-spinner fa-spin text-blue-400"></i> Redirecting...
                        </span>
                        <span id="redirect-url-label" class="text-slate-400 font-mono text-[10px] truncate max-w-[120px]"></span>
                    </div>

                    <!-- Image Overlay Info -->
                    <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-slate-950/90 via-slate-950/40 to-transparent p-4 flex flex-col justify-end">
                        <span id="preview-tag" class="text-xs uppercase tracking-widest text-blue-400 font-bold mb-1">Option 1</span>
                        <h2 id="preview-title" class="text-lg font-bold text-white flex items-center justify-between">
                            <span>Youtube2016</span>
                            <span id="redirect-badge" class="text-xs font-normal text-slate-300 bg-slate-800/80 px-2.5 py-1 rounded-md border border-slate-700 flex items-center gap-1.5">
                                Visit Target <i class="fa-solid fa-external-link text-[10px]"></i>
                            </span>
                        </h2>
                    </div>

                    <!-- Glowing Accent Ring -->
                    <div id="glow-border" class="absolute inset-0 rounded-2xl ring-2 ring-blue-500/50 pointer-events-none transition-all duration-500"></div>
                </div>

                <!-- Active Link URL Info Box -->
                <div class="mt-4 text-center">
                    <p class="text-xs text-slate-400">
                        Target URL: <a id="current-url-display" href="/Feed/Youtube2016/" target="_blank" class="text-blue-400 hover:underline font-mono">/Feed/Youtube2016/</a>
                    </p>
                </div>
            </div>

        </div>
    </main>

    <footer class="p-4 text-center text-xs text-slate-400">
        Interactive UI Showcase &bull; Click to update visual state & navigate
    </footer>

    <script>
        // Options configuration including redirect URLs
        const optionsData = [
            {
                title: "Youtube2016",
                tag: "Option 1",
                redirectUrl: "/Feed/Youtube2016/",
                imageUrl: "https://placehold.co/600x600/2563eb/ffffff?text=Youtube2016",
                activeBorder: "border-blue-500/50",
                activeBg: "from-blue-600/30 to-indigo-600/30",
                iconBg: "bg-blue-500",
                iconText: "text-blue-400",
                glowColor: "ring-blue-500/50",
                tagColor: "text-blue-400"
            },
            {
                title: "Youtube2012",
                tag: "Option 2",
                redirectUrl: "/Feed/Youtube2012/",
                imageUrl: "https://placehold.co/600x600/059669/ffffff?text=Youtube2012",
                activeBorder: "border-emerald-500/50",
                activeBg: "from-emerald-600/30 to-teal-600/30",
                iconBg: "bg-emerald-500",
                iconText: "text-emerald-400",
                glowColor: "ring-emerald-500/50",
                tagColor: "text-emerald-400"
            },
            {
                title: "Youtube2006",
                tag: "Option 3",
                redirectUrl: "/Feed/Youtube2006/",
                imageUrl: "https://placehold.co/600x600/9333ea/ffffff?text=Youtube2006",
                activeBorder: "border-purple-500/50",
                activeBg: "from-purple-600/30 to-pink-600/30",
                iconBg: "bg-purple-500",
                iconText: "text-purple-400",
                glowColor: "ring-purple-500/50",
                tagColor: "text-purple-400"
            },
            {
                title: "Roblox2016",
                tag: "Option 4",
                redirectUrl: "/Feed/Roblox2016/",
                imageUrl: "https://placehold.co/600x600/d97706/ffffff?text=Roblox2016",
                activeBorder: "border-amber-500/50",
                activeBg: "from-amber-600/30 to-orange-600/30",
                iconBg: "bg-amber-500",
                iconText: "text-amber-400",
                glowColor: "ring-amber-500/50",
                tagColor: "text-amber-400"
            },
            {
                title: "Roblox2006",
                tag: "Option 5",
                redirectUrl: "/Feed/Roblox2006/",
                imageUrl: "https://placehold.co/600x600/e11d48/ffffff?text=Roblox2006",
                activeBorder: "border-rose-500/50",
                activeBg: "from-rose-600/30 to-red-600/30",
                iconBg: "bg-rose-500",
                iconText: "text-rose-400",
                glowColor: "ring-rose-500/50",
                tagColor: "text-rose-400"
            }
        ];

        let selectedIndex = 0;

        function updateUI(idx) {
            selectedIndex = idx;
            const buttons = document.querySelectorAll('.btn-option');
            const previewImage = document.getElementById('preview-image');
            const previewTitle = document.getElementById('preview-title').querySelector('span');
            const previewTag = document.getElementById('preview-tag');
            const glowBorder = document.getElementById('glow-border');
            const currentUrlDisplay = document.getElementById('current-url-display');

            // Update state of buttons
            buttons.forEach((btn, i) => {
                const data = optionsData[i];
                const iconContainer = btn.querySelector('div > span');
                const linkIcon = btn.querySelector('.fa-arrow-up-right-from-square');

                if (i === idx) {
                    btn.className = `btn-option active group relative flex items-center justify-between px-6 py-4 rounded-xl border ${data.activeBorder} bg-gradient-to-r ${data.activeBg} text-white font-semibold tracking-wide shadow-lg hover:scale-[1.02] transition-all duration-300 w-full text-left focus:outline-none`;
                    iconContainer.className = `p-2.5 rounded-lg ${data.iconBg} text-white transition-colors duration-300`;
                    if (linkIcon) linkIcon.className = `fa-solid fa-arrow-up-right-from-square text-xs ${data.iconText} group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform`;
                } else {
                    btn.className = `btn-option group relative flex items-center justify-between px-6 py-4 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-300 font-semibold tracking-wide shadow-lg hover:scale-[1.02] transition-all duration-300 w-full text-left focus:outline-none`;
                    iconContainer.className = `p-2.5 rounded-lg bg-slate-700/50 ${data.iconText} group-hover:text-white transition-colors duration-300`;
                    if (linkIcon) linkIcon.className = `fa-solid fa-arrow-up-right-from-square text-xs text-slate-500 group-hover:${data.iconText} group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform`;
                }
            });

            // Transition Image Frame
            previewImage.style.opacity = '0.3';
            previewImage.style.transform = 'scale(0.95)';

            setTimeout(() => {
                const selectedData = optionsData[idx];
                previewImage.src = selectedData.imageUrl;
                previewTitle.textContent = selectedData.title;
                previewTag.textContent = selectedData.tag;
                previewTag.className = `text-xs uppercase tracking-widest ${selectedData.tagColor} font-bold mb-1`;
                glowBorder.className = `absolute inset-0 rounded-2xl ring-2 ${selectedData.glowColor} pointer-events-none transition-all duration-500`;

                currentUrlDisplay.href = selectedData.redirectUrl;
                currentUrlDisplay.textContent = selectedData.redirectUrl;

                previewImage.style.opacity = '1';
                previewImage.style.transform = 'scale(1)';
            }, 150);
        }

        // Handles button click: updates image state AND redirects
        function handleButtonClick(idx) {
            updateUI(idx);

            const selectedData = optionsData[idx];
            const redirectMode = document.querySelector('input[name="redirectMode"]:checked').value;
            const redirectBanner = document.getElementById('redirect-banner');
            const redirectUrlLabel = document.getElementById('redirect-url-label');
            const previewCard = document.getElementById('preview-card');

            // Visual feedback indicator
            redirectUrlLabel.textContent = selectedData.redirectUrl.replace('https://', '');
            redirectBanner.classList.remove('opacity-0');
            previewCard.classList.add('redirecting');

            // Perform redirection based on selected mode
            if (redirectMode === 'newtab') {
                setTimeout(() => {
                    window.open(selectedData.redirectUrl, '_blank');
                    redirectBanner.classList.add('opacity-0');
                    previewCard.classList.remove('redirecting');
                }, 300);
            } else if (redirectMode === 'same') {
                setTimeout(() => {
                    window.location.href = selectedData.redirectUrl;
                }, 400);
            } else if (redirectMode === 'demo') {
                // Demo mode simulates redirect process with visual feedback without leaving page
                setTimeout(() => {
                    redirectBanner.classList.add('opacity-0');
                    previewCard.classList.remove('redirecting');
                }, 1200);
            }
        }
    </script>
</body>
</html>

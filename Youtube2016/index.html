<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube (2016 Classic Feed)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background-color: #f1f1f1;
      color: #333333;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #cccccc;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #999999;
    }

    .yt-card {
      background: #ffffff;
      border: 1px solid #e2e2e2;
      border-bottom-width: 2px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    @media (min-width: 640px) {
      .yt-card:hover {
        border-color: #b8b8b8;
        box-shadow: 0 2px 5px rgba(0,0,0,0.12);
      }
      .yt-card:hover .yt-title {
        color: #167ac6;
      }
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-red-500 selection:text-white">

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 h-14 bg-white border-b border-[#e8e8e8] z-50 flex items-center justify-between px-3 sm:px-6 shadow-xs">
    
    <!-- Top Left Logo -->
    <div id="headerLogoContainer" class="flex items-center flex-shrink-0">
      <a href="https://example.com" class="block focus:outline-none py-1" title="YouTube Home">
        <img 
          src="https://placehold.co/120x32/e52d27/ffffff?text=" 
          alt="Logo" 
          class="h-7 sm:h-8 w-auto border border-red-700 rounded-xs shadow-xs object-cover"
          onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22120%22%20height%3D%2232%22%3E%3Crect%20width%3D%22120%22%20height%3D%2232%22%20fill%3D%22%23e52d27%22%2F%3E%3Cpolygon%20points%3D%2250%2C8%2050%2C24%2072%2C16%22%20fill%3D%22%23ffffff%22%2F%3E%3C%2Fsvg%3E'"
        >
      </a>
    </div>

    <!-- Search Bar -->
    <div id="searchBarContainer" class="hidden sm:flex flex-1 max-w-xl mx-2 sm:mx-4 items-center transition-all duration-200">
      <form id="searchForm" class="flex items-center w-full" onsubmit="return false;">
        <button type="button" id="mobileSearchBackBtn" class="sm:hidden text-gray-600 p-2 mr-1 hover:text-gray-900">
          <i class="fa-solid fa-arrow-left text-base"></i>
        </button>
        <div class="relative w-full">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search" 
            class="w-full bg-white text-gray-800 text-sm px-3 py-1.5 sm:py-1 border border-[#ccc] rounded-l-sm focus:outline-none focus:border-[#167ac6] shadow-inner transition"
          >
          <button type="button" id="clearSearchBtn" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700 text-xs p-1">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <button type="button" id="searchSubmitBtn" class="bg-[#f8f8f8] hover:bg-[#f0f0f0] active:bg-[#e8e8e8] border border-l-0 border-[#ccc] text-gray-600 px-4 sm:px-5 py-1.5 sm:py-1 rounded-r-sm transition flex items-center justify-center shadow-xs flex-shrink-0">
          <i class="fa-solid fa-magnifying-glass text-xs"></i>
        </button>
      </form>
    </div>

    <div id="mobileSearchTriggerContainer" class="flex items-center sm:hidden">
      <button id="mobileSearchToggleBtn" class="p-2 text-gray-600 hover:text-gray-900 focus:outline-none" aria-label="Open Search">
        <i class="fa-solid fa-magnifying-glass text-lg"></i>
      </button>
    </div>
  </header>

  <!-- Main Content Feed -->
  <main class="flex-1 pt-16 sm:pt-18 p-2 sm:p-4 md:p-6 max-w-[1800px] mx-auto w-full">
    
    <!-- Controls Bar -->
    <div class="bg-white border border-[#e2e2e2] rounded-sm p-3 mb-4 flex flex-wrap items-center justify-between gap-3 shadow-xs">
      <div class="flex items-center gap-2 text-xs text-gray-600 font-medium">
        <i class="fa-solid fa-arrow-down-short-wide text-gray-500"></i>
        <span>Sort feed:</span>
        <select id="sortSelect" class="bg-[#f8f8f8] border border-[#ccc] text-gray-800 text-xs rounded-sm px-2.5 py-1 focus:outline-none focus:border-[#167ac6] cursor-pointer font-medium">
          <option value="num-asc">Sort: 1 to 200</option>
          <option value="num-desc">Sort: 200 to 1</option>
        </select>
      </div>

      <div class="text-xs text-gray-500 font-medium flex items-center gap-2">
        <span>Showing <b id="visibleCount" class="text-gray-800">200</b> of 200 videos</span>
      </div>
    </div>

    <!-- Search Status -->
    <div id="searchStatus" class="hidden mb-3 text-xs text-gray-600 bg-white p-2.5 rounded border border-[#e2e2e2] flex justify-between items-center shadow-xs">
      <span class="truncate pr-2">Filtering for "<b id="searchQueryText"></b>" (<span id="resultCount">0</span> matches)</span>
      <button id="clearFilterBtn" class="text-[#167ac6] hover:underline font-medium flex-shrink-0">Clear Search</button>
    </div>

    <!-- Video Grid -->
    <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4"></div>

    <!-- Empty State -->
    <div id="noResultsState" class="hidden text-center py-12 sm:py-16 bg-white border border-[#e2e2e2] rounded my-4 px-4">
      <i class="fa-solid fa-video-slash text-4xl text-gray-300 mb-3"></i>
      <h3 class="text-base font-bold text-gray-700">No videos found</h3>
      <p class="text-xs text-gray-500 mt-1">Try typing a different search term or channel name.</p>
      <button id="resetSearchBtn" class="mt-4 bg-[#f8f8f8] border border-[#d3d3d3] hover:bg-[#f0f0f0] text-gray-800 text-xs px-4 py-2 font-medium rounded-sm">
        Reset Search
      </button>
    </div>

    <!-- Loader -->
    <div id="feedLoader" class="py-8 text-center flex flex-col items-center justify-center gap-2">
      <div class="w-7 h-7 border-3 border-gray-300 border-t-[#cc181e] rounded-full animate-spin"></div>
      <span class="text-xs text-gray-500 font-medium">Loading videos...</span>
    </div>
  </main>

    function generateVideos() {
      allVideos = [];
      for (let i = 0; i < TOTAL_VIDEOS; i++) {
        const indexNumber = i + 1;
        const topic = BASE_TOPICS[i % BASE_TOPICS.length];
        const channel = UNIQUE_CREATORS[i];

        const seed = ((indexNumber * 9301 + 49297) % 233280);
        const seed2 = ((indexNumber * 49297 + 9301) % 233280);

        const rawViews = Math.floor((seed / 233280) * 9800000) + 1500;
        let viewsFormatted = rawViews >= 1000000 
          ? (rawViews / 1000000).toFixed(1) + "M views" 
          : Math.floor(rawViews / 1000) + "K views";

        const monthsAgo = Math.floor((seed2 / 233280) * 11) + 1;
        const timeAgo = monthsAgo === 1 ? "1 month ago" : `${monthsAgo} months ago`;

        // Generate unique redirect link for each video (1 to 200)
        const redirectUrl = CUSTOM_REDIRECT_URLS[indexNumber] || `https://example.com/video/${indexNumber}`;

        // Generate unique thumbnail URL for each video (1 to 200)
        const thumbnailSrc = CUSTOM_THUMBNAILS[indexNumber] || `https://example.com/thumbnails/thumb-${indexNumber}.png`;

        allVideos.push({
          id: indexNumber,
          title: topic,
          channel: channel,
          rawViews: rawViews,
          views: viewsFormatted,
          timeAgo: timeAgo,
          redirectUrl: redirectUrl,
          thumbnail: thumbnailSrc
        });
      }
      applyFiltersAndSort();
    }

    function createCardHTML(video) {
      return `
        <a href="${video.redirectUrl}" class="yt-card rounded-sm overflow-hidden cursor-pointer flex flex-col group block active:bg-gray-50">
          <div class="relative aspect-video bg-gray-200 overflow-hidden flex-shrink-0">
            <img 
              src="${video.thumbnail}" 
              class="w-full h-full object-cover group-hover:opacity-95 transition duration-150" 
              alt="${video.title}"
              loading="lazy"
              onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22320%22%20height%3D%22180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23e5e5e5%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%226%22%20width%3D%2242%22%20height%3D%2220%22%20rx%3D%222%22%20fill%3D%22%23000000%22%20opacity%3D%220.82%22%2F%3E%3Ctext%20x%3D%2227%22%20y%3D%2220%22%20font-family%3D%22Roboto%2C%20sans-serif%22%20font-size%3D%2211%22%20font-weight%3D%22700%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3E${video.id}%3C%2Ftext%3E%3C%2Fsvg%3E'"
            >
          </div>
          <div class="p-2.5 sm:p-3 flex flex-col flex-1 justify-between bg-white">
            <div>
              <h3 class="yt-title text-xs sm:text-sm font-bold text-gray-900 line-clamp-2 leading-tight transition">
                ${video.title}
              </h3>
              <p class="text-[11px] sm:text-xs text-gray-600 mt-1 flex items-center gap-1 font-medium truncate">
                ${video.channel}
                <i class="fa-solid fa-circle-check text-[9px] text-gray-400 flex-shrink-0"></i>
              </p>
            </div>
            <div class="mt-2 text-[10px] sm:text-[11px] text-gray-500 flex items-center gap-1.5 border-t border-gray-100 pt-1.5">
              <span>${video.views}</span>
              <span>•</span>
              <span>${video.timeAgo}</span>
            </div>
          </div>
        </a>
      `;
    }

    function renderBatch() {
      const grid = document.getElementById('videoGrid');
      const loader = document.getElementById('feedLoader');
      const noResults = document.getElementById('noResultsState');

      if (loadedCount === 0) grid.innerHTML = '';

      if (filteredVideos.length === 0) {
        noResults.classList.remove('hidden');
        loader.classList.add('hidden');
        return;
      } else {
        noResults.classList.add('hidden');
      }

      const nextItems = filteredVideos.slice(loadedCount, loadedCount + BATCH_SIZE);
      nextItems.forEach(video => grid.insertAdjacentHTML('beforeend', createCardHTML(video)));
      loadedCount += nextItems.length;

      if (loadedCount >= filteredVideos.length) {
        loader.classList.add('hidden');
      } else {
        loader.classList.remove('hidden');
      }
    }

    function applyFiltersAndSort() {
      loadedCount = 0;
      const searchStatus = document.getElementById('searchStatus');
      const searchQueryText = document.getElementById('searchQueryText');
      const resultCount = document.getElementById('resultCount');
      const visibleCount = document.getElementById('visibleCount');

      filteredVideos = allVideos.filter(video => {
        if (!currentSearch) return true;
        const q = currentSearch.toLowerCase();
        return video.title.toLowerCase().includes(q) || video.channel.toLowerCase().includes(q);
      });

      filteredVideos.sort((a, b) => {
        return currentSort === 'num-asc' ? a.id - b.id : b.id - a.id;
      });

      visibleCount.innerText = filteredVideos.length;

      if (currentSearch) {
        searchStatus.classList.remove('hidden');
        searchQueryText.innerText = currentSearch;
        resultCount.innerText = filteredVideos.length;
      } else {
        searchStatus.classList.add('hidden');
      }

      renderBatch();
    }

    function setupEvents() {
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      const searchSubmitBtn = document.getElementById('searchSubmitBtn');
      const sortSelect = document.getElementById('sortSelect');
      const mobileSearchToggleBtn = document.getElementById('mobileSearchToggleBtn');
      const mobileSearchBackBtn = document.getElementById('mobileSearchBackBtn');
      const searchBarContainer = document.getElementById('searchBarContainer');
      const headerLogoContainer = document.getElementById('headerLogoContainer');
      const mobileSearchTriggerContainer = document.getElementById('mobileSearchTriggerContainer');

      searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value.trim();
        clearSearchBtn.classList.toggle('hidden', !currentSearch);
        applyFiltersAndSort();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        currentSearch = '';
        clearSearchBtn.classList.add('hidden');
        applyFiltersAndSort();
        searchInput.focus();
      });

      searchSubmitBtn.addEventListener('click', () => {
        currentSearch = searchInput.value.trim();
        applyFiltersAndSort();
      });

      sortSelect.addEventListener('change', (e) => {
        currentSort = e.target.value;
        applyFiltersAndSort();
      });

      mobileSearchToggleBtn.addEventListener('click', () => {
        headerLogoContainer.classList.add('hidden');
        mobileSearchTriggerContainer.classList.add('hidden');
        searchBarContainer.classList.remove('hidden');
        searchBarContainer.classList.add('flex');
        searchInput.focus();
      });

      mobileSearchBackBtn.addEventListener('click', () => {
        searchBarContainer.classList.add('hidden');
        searchBarContainer.classList.remove('flex');
        headerLogoContainer.classList.remove('hidden');
        mobileSearchTriggerContainer.classList.remove('hidden');
      });

      document.getElementById('resetSearchBtn').addEventListener('click', () => {
        searchInput.value = '';
        currentSearch = '';
        clearSearchBtn.classList.add('hidden');
        applyFiltersAndSort();
      });

      window.addEventListener('scroll', () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
          if (loadedCount < filteredVideos.length) {
            renderBatch();
          }
        }
      });
    }

    window.onload = function() {
      generateVideos();
      setupEvents();
    };
  </script>
